# =============================================================================
# Servidor DMZ Perimetral - Nginx Reverse Proxy & WAF Básico (Diagrama D11)
# Terminación HTTPS / TLS 1.3, HSTS y enrutamiento interno hacia Spring Boot
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Ocultar versión del servidor (Hardening DMZ)
    server_tokens off;

    # Limitación de tasa contra fuerza bruta en autenticación (RNF01)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

    # Redirección obligatoria HTTP -> HTTPS (Sección 10.4)
    server {
        listen 80;
        server_name tienda-internacional.local;
        return 301 https://$host$request_uri;
    }

    # Nodo Perimetral TLS 1.3 (Puerto 443)
    server {
        listen 443 ssl http2;
        server_name tienda-internacional.local;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Cabeceras de Seguridad Estrictas (HSTS + WAF Headers)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # SPA React/TypeScript (Portal Tienda + Panel Operativo + Panel Seguridad)
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Módulo Independiente de Seguridad (OAuth2 / JWT RS256 / RBAC)
        location /api/seguridad/ {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://127.0.0.1:8080/api/seguridad/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # API REST de Módulos Operativos (Spring Boot Clúster)
        location /api/ {
            proxy_pass http://127.0.0.1:8080/api/;
            proxy_read_timeout 15s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
